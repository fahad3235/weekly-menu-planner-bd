<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly Menu Planner BD</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="loading" class="loading">Loading...</div>

<div id="app" hidden>
  <header class="topbar no-print">
    <div class="brand">
      <h1 id="appTitle">Weekly Menu Planner BD</h1>
      <p id="appSub" class="sub"></p>
    </div>
    <div class="top-actions">
      <button id="langBtn" type="button" class="btn ghost">Bangla</button>
      <button id="printBtn" type="button" class="btn">Print menu</button>
    </div>
  </header>

  <nav class="weeknav no-print" aria-label="week navigation">
    <button id="prevWeek" type="button" class="btn ghost">&lt; Previous week</button>
    <button id="thisWeek" type="button" class="btn ghost">This week</button>
    <div id="weekLabel" class="week-label" aria-live="polite"></div>
    <button id="nextWeek" type="button" class="btn ghost">Next week &gt;</button>
  </nav>

  <h2 id="printTitle" class="print-only"></h2>

  <main>
    <section id="weekGrid" class="week-grid" aria-label="weekly menu grid"></section>

    <section class="panel no-print" aria-labelledby="groceryTitle">
      <h2 id="groceryTitle">Grocery checklist</h2>
      <div class="row">
        <button id="genBtn" type="button" class="btn primary">Generate from menu</button>
        <button id="removeCheckedBtn" type="button" class="btn ghost">Remove checked</button>
      </div>
      <div class="row">
        <input id="addItemInput" type="text" class="text-input grow" maxlength="60" placeholder="Add a grocery item...">
        <button id="addItemBtn" type="button" class="btn">Add</button>
      </div>
      <ul id="groceryList" class="grocery-list"></ul>
    </section>

    <section class="panel no-print" aria-labelledby="mappingTitle">
      <h2 id="mappingTitle">Keyword mapping</h2>
      <p id="mappingHint" class="hint"></p>
      <table class="map-table">
        <tbody id="mappingBody"></tbody>
      </table>
      <div class="row">
        <input id="ruleKey" type="text" class="text-input" maxlength="40" placeholder="Keyword">
        <input id="ruleItems" type="text" class="text-input grow" maxlength="120" placeholder="Items (comma separated)">
        <button id="addRuleBtn" type="button" class="btn">Add rule</button>
      </div>
    </section>

    <section class="panel no-print" aria-labelledby="toolsTitle">
      <h2 id="toolsTitle">Week tools</h2>
      <div class="row">
        <button id="dupBtn" type="button" class="btn">Duplicate last week's menu</button>
      </div>
      <div class="clearbox">
        <h3 id="clearTitle">Clear this week</h3>
        <div class="row">
          <label id="clearLabel" for="clearInput" class="hint">Type DELETE to confirm:</label>
          <input id="clearInput" type="text" class="text-input" maxlength="10" placeholder="DELETE" autocomplete="off">
          <button id="clearBtn" type="button" class="btn danger">Clear week</button>
        </div>
      </div>
    </section>

    <section class="panel no-print" aria-labelledby="dataTitle">
      <h2 id="dataTitle">Backup &amp; restore</h2>
      <div class="row">
        <button id="exportBtn" type="button" class="btn">Download JSON</button>
        <button id="importBtn" type="button" class="btn primary">Import</button>
      </div>
      <textarea id="exportArea" class="json-area" rows="6" readonly aria-label="exported json"></textarea>
      <textarea id="importArea" class="json-area" rows="6" placeholder="Paste exported JSON here..."></textarea>
      <p id="importErr" class="error" hidden></p>
    </section>
  </main>

  <footer class="no-print">
    <p id="footerText"></p>
  </footer>
</div>

<datalist id="dishList"></datalist>
<div id="toast" class="toast" role="status" hidden></div>

<script src="app.js"></script>
</body>
</html>
